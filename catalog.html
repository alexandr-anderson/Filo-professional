<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — FILO Professional Russia</title>
  <meta name="description" content="Каталог профессиональной косметики FILO Professional. Редукторы объёма, лечение, home care и финиш.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body data-page="catalog">
  <div class="top-bar" id="topBar"></div>
  <header class="header"></header>

  <main>
    <div class="catalog-header">
      <div class="container">
        <h1 class="catalog-header__title">Каталог</h1>
        <p class="catalog-header__text">Профессиональная косметика FILO Professional для салонов и домашнего ухода</p>
      </div>
    </div>

    <section class="section section--catalog">
      <div class="container">
        <div class="catalog-toolbar">
          <div class="filter-tabs" id="filterTabs">
            <button class="filter-tab" data-cat="all">Все товары</button>
            <button class="filter-tab" data-cat="volume">Редуктор объёма</button>
            <button class="filter-tab" data-cat="treatment">Лечение</button>
            <button class="filter-tab" data-cat="homecare">Home Care</button>
            <button class="filter-tab" data-cat="finisher">Финиш</button>
          </div>
          <span class="catalog-toolbar__count" id="catalogCount"></span>
        </div>
        <div class="products-grid products-grid--catalog" id="catalogProducts"></div>
      </div>
    </section>
  </main>

  <footer class="footer"></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
