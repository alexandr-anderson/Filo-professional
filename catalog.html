<body data-page="catalog">
  <div class="top-bar" id="topBar"></div>
  <header class="header"></header>

  <main>
    <div class="catalog-header">
      <div class="container">
        <h1 class="catalog-header__title">Каталог для салонов и мастеров</h1>
        <p class="catalog-header__text">
          Линейки для кератинирования, редуктора объёма, восстановления и home care для клиентов.
          Цены на ключевые позиции в каталоге. Остальной прайс — в Telegram.
        </p>
      </div>
    </div>

    <section class="section section--catalog">
      <div class="container">
        <div class="catalog-toolbar">
          <div class="filter-tabs" id="filterTabs">
            <button class="filter-tab" data-cat="all">Все товары</button>
            <button class="filter-tab" data-cat="volume">Редуктор объёма</button>
            <button class="filter-tab" data-cat="treatment">Лечение</button>
            <button class="filter-tab" data-cat="homecare">Home Care</button>
            <button class="filter-tab" data-cat="finisher">Финиш</button>
          </div>
          <span class="catalog-toolbar__count" id="catalogCount"></span>
        </div>
        <div class="products-grid products-grid--catalog" id="catalogProducts"></div>
      </div>
    </section>
  </main>

  <footer class="footer"></footer>
  <script type="module" src="/src/main.js"></script>
