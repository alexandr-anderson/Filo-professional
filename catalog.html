<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог FILO Professional для салонов — официальный дистрибьютор</title>
  <meta name="description" content="Профессиональный каталог FILO для салонов и мастеров: кератин, редуктор объёма, восстановление, home care. Прайс в Telegram. Доставка по России.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://filo-professional.ru/catalog.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="FILO Professional Russia">
  <meta property="og:url" content="https://filo-professional.ru/catalog.html">
  <meta property="og:title" content="Каталог FILO Professional для салонов и мастеров">
  <meta property="og:description" content="Кератин, ботокс, редуктор, home care. Прайс для профессионалов — в Telegram.">
  <meta property="og:image" content="https://filo-professional.ru/images/hero-brand.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body data-page="catalog">
  <a class="skip-link" href="#main">К содержимому</a>
  <header class="site-bar" id="siteBar"></header>

  <main id="main" class="catalog-page">
    <aside class="catalog-registry" aria-label="Фильтр по линейкам">
      <p class="catalog-registry__label">Реестр</p>
      <ul class="registry-list" id="registryList" role="tablist"></ul>
    </aside>

    <div class="catalog-main">
      <div class="catalog-mobile-filter" id="mobileFilter" role="tablist" aria-label="Линейки"></div>
      <div class="catalog-toolbar">
        <div class="catalog-search">
          <label class="visually-hidden" for="catalogSearch">Поиск</label>
          <input type="search" id="catalogSearch" placeholder="кератин, ботокс, объём…" autocomplete="off">
        </div>
        <span class="catalog-toolbar__count" id="catalogCount"></span>
      </div>
      <div class="shelf-grid" id="shelfGrid"></div>
    </div>
  </main>

  <footer class="footer"></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
