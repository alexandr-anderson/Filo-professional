<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог FILO Professional для салонов — официальный дистрибьютор</title>
  <meta name="description" content="Профессиональный каталог FILO для салонов и мастеров: кератин, редуктор объёма, восстановление, home care. Прайс в Telegram. Доставка по России.">
  <link rel="canonical" href="https://filo-professional.ru/catalog.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="FILO Professional Russia">
  <meta property="og:url" content="https://filo-professional.ru/catalog.html">
  <meta property="og:title" content="Каталог FILO Professional для салонов и мастеров">
  <meta property="og:description" content="Кератин, ботокс, редуктор, home care. Прайс для профессионалов — в Telegram.">
  <meta property="og:image" content="https://filo-professional.ru/images/hero-brand.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Piazzolla:ital,opsz,wght@0,8..30,400;0,8..30,500;0,8..30,600;1,8..30,400;1,8..30,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body data-page="catalog">
  <a class="skip-link" href="#main">К содержимому</a>
  <div class="top-bar" id="topBar"></div>
  <header class="header"></header>

  <main id="main">
    <header class="catalog-intro">
      <div class="container catalog-intro__inner">
        <p class="section__label">Каталог</p>
        <h1 class="catalog-intro__title">FILO <em>для кресла</em></h1>
        <p class="catalog-intro__text">
          Редуктор, лечение, home care и финиш — позиции под салонные протоколы.
          Цены на ключевые позиции здесь, остальной прайс — в Telegram.
        </p>
        <div class="catalog-intro__actions">
          <a href="#" data-telegram="price" class="btn btn--primary">Прайс в Telegram</a>
        </div>
      </div>
    </header>

    <section class="section section--catalog" data-reveal>
      <div class="container catalog-layout">
        <aside class="catalog-filters" aria-label="Фильтр по линейкам">
          <p class="catalog-filters__label">Линейки</p>
          <div class="filter-tabs" id="filterTabs" role="tablist"></div>
        </aside>
        <div class="catalog-main">
          <div class="catalog-toolbar">
            <span class="catalog-toolbar__count" id="catalogCount"></span>
          </div>
          <div class="products-grid products-grid--catalog" id="catalogProducts"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer"></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
